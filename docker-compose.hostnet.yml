# Override for hosts where Docker bridge networking between containers is blocked
# (e.g. some sandboxes). Usage:
#   APP_PORT=8120 docker compose -f docker-compose.yml -f docker-compose.hostnet.yml up -d --build
services:
  db:
    network_mode: host
    command: ["postgres", "-p", "${DB_PORT:-5442}"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p ${DB_PORT:-5442} -U ${POSTGRES_USER:-tezz}"]
  api:
    network_mode: host
    command: ["uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "${API_PORT:-8121}"]
    environment:
      DATABASE_URL: postgresql+pg8000://tezz:tezz_dev_password@127.0.0.1:${DB_PORT:-5442}/tezz
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${API_PORT:-8121}/health')"]
  web:
    network_mode: host
    build:
      args:
        API_PROXY_TARGET: http://127.0.0.1:${API_PORT:-8121}
    environment:
      PORT: ${APP_PORT:-8120}
      HOSTNAME: 0.0.0.0
    ports: !reset []
